<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 460" fill="none">
  <!-- ZAN — fırça tutan boya ustası (subscribe bölməsi) -->
  <defs>
    <linearGradient id="paint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e3243d"/>
      <stop offset="1" stop-color="#a71930"/>
    </linearGradient>
    <linearGradient id="overall" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#557aa3"/>
      <stop offset="1" stop-color="#3b5a80"/>
    </linearGradient>
    <linearGradient id="bucket" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f4f5f7"/>
      <stop offset="1" stop-color="#c9ced6"/>
    </linearGradient>
  </defs>

  <!-- yer kölgəsi -->
  <ellipse cx="170" cy="444" rx="112" ry="10" fill="#0d1520" opacity=".14"/>

