<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!--
    ZAN kursoru: boya fırçası.

    Fırça öz oxu üzərində (uc yuxarıda, sap aşağıda) çəkilib, sonra bütöv
    halda -45° döndərilir və ucu (3.2, 3.2) nöqtəsinə oturdulur — CSS-dəki
    hotspot da elə oradadır.

    Hər forma əvvəlcə qalın ağ konturla, sonra rəngli doldurma ilə çəkilir ki,
    kursor həm açıq, həm də tünd fonun üstündə seçilsin.
  -->
  <defs>
    <linearGradient id="zan-handle" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7d0f21"/>
      <stop offset="0.5" stop-color="#c9142c"/>
      <stop offset="1" stop-color="#8f1223"/>
    </linearGradient>
    <linearGradient id="zan-ferrule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#cfa945"/>
      <stop offset="0.45" stop-color="#f6e2a4"/>
      <stop offset="1" stop-color="#c79f3c"/>
    </linearGradient>
    <linearGradient id="zan-bristle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#10151c"/>
      <stop offset="1" stop-color="#2c3947"/>
    </linearGradient>

    <g id="zan-brush-shape">
      <path d="M0 0 C 1.6 4.6 3.9 8.2 4.6 11.4 L -4.6 11.4 C -3.9 8.2 -1.6 4.6 0 0 Z"/>
      <rect x="-5" y="11" width="10" height="5.4" rx="1.3"/>
      <path d="M-3.4 16.2 L3.4 16.2 L2.3 29.4 C 2.3 31.1 -2.3 31.1 -2.3 29.4 Z"/>
    </g>
  </defs>

  <g transform="translate(3.2 3.2) rotate(-45)">
    <use href="#zan-brush-shape" fill="none" stroke="#ffffff" stroke-width="2.8"
         stroke-linejoin="round" stroke-linecap="round"/>

    <path d="M0 0 C 1.6 4.6 3.9 8.2 4.6 11.4 L -4.6 11.4 C -3.9 8.2 -1.6 4.6 0 0 Z"
          fill="url(#zan-bristle)"/>
    <rect x="-5" y="11" width="10" height="5.4" rx="1.3" fill="url(#zan-ferrule)"/>
    <path d="M-3.4 16.2 L3.4 16.2 L2.3 29.4 C 2.3 31.1 -2.3 31.1 -2.3 29.4 Z"
          fill="url(#zan-handle)"/>
  </g>
</svg>
